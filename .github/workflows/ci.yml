# CI — Castillo AI Platform · G12.1 (Q-CI-01 → CERRADO DE VERDAD)
#
# CORRECCIÓN RAÍZ (0004): este workflow vivió ANIDADO en
# club-platform-castillo_country_club/.github/workflows/ desde G10 —
# GitHub Actions SOLO descubre workflows en .github/workflows/ de la
# RAÍZ del repo → 0 corridas en toda la historia (push a165339 nunca
# disparó nada). Movido a raíz; los masters ya documentaban
# `.github/workflows/ci.yml` (BASE:236/CP:268/CL:228) — el árbol es
# el que estaba desincronizado, no la documentación.
#
# DETERMINISMO (0004): ratchets corren las versiones del uv.lock
# (mypy 2.1.0 · ruff 0.15.12 vía `uv run`) — nunca `uvx`/pip-latest.
# El baseline 1288/735 fue medido con latest-del-día; el lock da
# 1292/737 → re-baseline honesto (delta G12 = 0 en ambos).
#
# Q-CI-03 (run #3 · 741e0a4 — 2 rojos, 2 verdes): frontend y
# consistency VERDES; las anotaciones de deuda (vitest/eslint) son
# informativas — el ratchet aguantó. Los rojos eran del PROPIO
# workflow, no del código:
#   (a) ci-summary heredaba defaults.run.working-directory del nivel
#       workflow pero NO hace checkout → bash ni siquiera arranca
#       ("No such file or directory"). Defaults bajados a nivel job,
#       solo donde se usan; ci-summary corre en la raíz del workspace.
#   (b) `uv pip install -e .` nunca fue validado en sandbox y es
#       redundante con `uv sync` (que ya instala el proyecto editable
#       cuando está empaquetado) — paso eliminado. uv sync ahora
#       --frozen: si el lock falta o desincroniza, CI lo dice en el
#       paso exacto en vez de fallar difuso más adelante.
#
# Estrategia HONESTA (lección del P0 0002: un gate verde no prueba nada
# del artefacto; un CI rojo por deuda vieja prueba que nadie lo mira):
#
#   1. GATES DUROS (bloquean el merge — hoy están VERDES):
#      build + verify:build-css (OUTPUT real del bundle) · VI ·
#      consistency (masters↔manifest↔árbol) · pytest 818 · smoke B0.
#
#   2. RATCHET DE DEUDA (bloquean si SUBEN; ideally bajan):
#      La deuda pre-G10 está medida y congelada en backend/docs/evidence/
#      ci-baseline.json: vitest 6 fails · guardian 15198 err · eslint
#      1583 err · ruff 1292 · mypy 737. Un PR que sube cualquiera de
#      esas cifras NO pasa. Bajarlas es siempre bienvenido (y actualiza
#      el baseline con --fix-baseline en el mismo PR).
#
#   3. TODO corre en PR + push a audit/**; el master del repo de
#      trabajo es audit/p2c3 (dual-track documentado en CHECKPOINT §3.6).
#
# Corrida de referencia (sandbox G10, 2026-11-11): frontend ~4 min
# (build 18.3s + vitest 90s) · backend ~4 min (uv sync 90s + pytest 13s
# + smoke 8s) — dentro del budget gratis de GitHub Actions.

name: CI

on:
  push:
    branches: [audit/**]
  pull_request:
    branches: [audit/**, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════
  # JOB 1 — CONSISTENCY (el slice del AI Guardian, DECISION-0006 §5)
  # Sin deps de node ni python: corre en 2 segundos.
  # ════════════════════════════════════════════════════════════════
  consistency:
    name: masters ↔ manifest ↔ árbol (MC-01..09 · IG-01..04)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: club-platform-castillo_country_club
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify-master-consistency
        run: python scripts/verify-master-consistency.py

  # ════════════════════════════════════════════════════════════════
  # JOB 2 — FRONTEND (gates duros + ratchet de deuda)
  # ════════════════════════════════════════════════════════════════
  frontend:
    name: frontend (build · css · VI · vitest · guardian · lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: club-platform-castillo_country_club/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: club-platform-castillo_country_club/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # GATE DURO 1 — type-check + build (tsc -b && vite build)
      - name: "build (tsc -b && vite build)"
        run: pnpm run build

      # GATE DURO 2 — sonda del OUTPUT: el gate que cazó el P0 0002
      - name: verify-build-css (post-build bundle probe)
        run: pnpm run verify:build-css

      # GATE DURO 3 — integración (8 checks VI v3.3.0)
      - name: verify-integration
        run: pnpm run verify:integration

      # RATCHET - vitest: deuda congelada (6 fails pre-G10, features
      # guests/lib desincronizadas ANTES de e15068e - deuda #G10-1)
      - name: vitest ratchet (fails <= baseline)
        run: |
          set +e
          pnpm run test 2>&1 | tee /tmp/vitest.log
          FAILS=$(grep -oE "Tests  [0-9]+ failed" /tmp/vitest.log | grep -oE "[0-9]+" || echo 0)
          BASE=$(python3 -c "import json;print(json.load(open('../backend/docs/evidence/ci-baseline.json'))['vitest_fails'])")
          echo "fails=$FAILS baseline=$BASE"
          if [ "$FAILS" -gt "$BASE" ]; then
            echo "::error::vitest debt subió ($FAILS > $BASE) - fix los tests nuevos o actualiza baseline con justificación"
            exit 1
          fi

      # RATCHET - guardian: 15198 err congelados (muro M-01, FASE 2 sin
      # migrar; score 8.2 vs threshold 9.3 = deuda conocida §15)
      - name: guardian ratchet (errors <= baseline)
        run: |
          set +e
          pnpm run guardian 2>&1 | tee /tmp/guardian.log
          ERRS=$(grep -oE "errors: +[0-9]+" /tmp/guardian.log | grep -oE "[0-9]+" || echo 0)
          BASE=$(python3 -c "import json;print(json.load(open('../backend/docs/evidence/ci-baseline.json'))['guardian_errors'])")
          echo "guardian errors=$ERRS baseline=$BASE"
          if [ "$ERRS" -gt "$BASE" ]; then
            echo "::error::guardian debt subió ($ERRS > $BASE) - las X-series no pueden empeorar"
            exit 1
          fi

      # RATCHET - eslint: 1583 err congelados
      - name: lint ratchet (errors <= baseline)
        run: |
          set +e
          pnpm run lint 2>&1 | tee /tmp/eslint.log
          ERRS=$(grep -oE "[0-9]+ problems \([0-9]+ errors" /tmp/eslint.log | grep -oE "\([0-9]+" | tr -d "(" || echo 0)
          BASE=$(python3 -c "import json;print(json.load(open('../backend/docs/evidence/ci-baseline.json'))['eslint_errors'])")
          echo "eslint errors=$ERRS baseline=$BASE"
          if [ "$ERRS" -gt "$BASE" ]; then
            echo "::error::eslint debt subió ($ERRS > $BASE)"
            exit 1
          fi

      - name: upload dist artifact (evidencia del OUTPUT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: club-platform-castillo_country_club/frontend/dist/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════
  # JOB 3 — BACKEND (gates duros + ratchet)
  # ════════════════════════════════════════════════════════════════
  backend:
    name: backend (pytest 827 · smoke B0 · ruff · mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: club-platform-castillo_country_club/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pipx install uv
      - name: Setup Python 3.12
        run: uv python install 3.12

      # GATE DURO 4 — la suite completa (818 base + 9 G12 = 827).
      # uv sync YA instala el proyecto (editable): `uv pip install -e .`
      # era redundante, nunca se validó en sandbox y muere en proyectos
      # virtuales (Q-CI-03 (b)). --frozen = lock commiteado tal cual; si
      # falta o desincronizó, CI lo dice EN ESTE PASO, no difuso después.
      - name: uv sync --frozen (lock exacto, extra dev)
        run: uv sync --frozen --extra dev
      - name: pytest 827 (suite completa)
        run: uv run pytest tests/unit -q

      # GATE DURO 5 — el gate ejecutable B0 (19 agentes · 207 tools · RBAC)
      - name: smoke_b0 (composicion+registro+RBAC+HITL+HTTP)
        run: uv run python scripts/smoke_b0.py

      # RATCHET — ruff: 1292 err congelados bajo lock 0.15.12 (892 autofixables:
      # UP045/UP017/F401). 1288 era deriva de uvx-latest 0.17.4 (C401/SIM105).
      - name: ruff ratchet (errors <= baseline)
        run: |
          set +e
          uv run ruff check src tests 2>&1 | tee /tmp/ruff.log
          ERRS=$(grep -oE "Found [0-9]+ errors" /tmp/ruff.log | grep -oE "[0-9]+" || echo 0)
          BASE=$(python3 -c "import json;print(json.load(open('docs/evidence/ci-baseline.json'))['ruff_errors'])")
          echo "ruff errors=$ERRS baseline=$BASE"
          if [ "$ERRS" -gt "$BASE" ]; then
            echo "::error::ruff debt subió ($ERRS > $BASE) — 892 son autofixables: ruff check --fix baja el piso"
            exit 1
          fi

      # RATCHET — mypy strict: 737 err congelados bajo lock (735 era
      # deriva de uvx-latest; delta G12 = 0).
      - name: mypy strict ratchet (errors <= baseline)
        run: |
          set +e
          uv run mypy src/club_mcp 2>&1 | tee /tmp/mypy.log
          ERRS=$(grep -oE "Found [0-9]+ errors" /tmp/mypy.log | grep -oE "[0-9]+" || echo 0)
          BASE=$(python3 -c "import json;print(json.load(open('docs/evidence/ci-baseline.json'))['mypy_errors'])")
          echo "mypy errors=$ERRS baseline=$BASE"
          if [ "$ERRS" -gt "$BASE" ]; then
            echo "::error::mypy debt subió ($ERRS > $BASE)"
            exit 1
          fi

  # ════════════════════════════════════════════════════════════════
  # JOB 4 — RESUMEN (falla el PR si cualquier gate duro o ratchet rompió)
  # ════════════════════════════════════════════════════════════════
  ci-summary:
    name: CI verdict (gates duros + ratchets)
    needs: [consistency, frontend, backend]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 30
    # SIN defaults y SIN checkout a propósito: solo lee needs.*.result.
    # (Q-CI-03 (a): heredar el working-directory del nivel workflow sin
    # checkout hacía que bash no pudiera ni arrancar.)
    steps:
      - name: verdict
        run: |
          echo "consistency: ${{ needs.consistency.result }}"
          echo "frontend:    ${{ needs.frontend.result }}"
          echo "backend:     ${{ needs.backend.result }}"
          if [ "${{ needs.consistency.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ]; then
            echo "::error::CI ROJO — ver jobs arriba (gates duros o ratchet de deuda)"
            exit 1
          fi
          echo "CI VERDE — gates duros ✓ ratchets ✓"
