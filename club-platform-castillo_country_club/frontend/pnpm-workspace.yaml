# B4.1: pnpm >=12 reads build-script approvals from this file. core-js
# postinstall is the known no-op funding banner — declare it so CI
# `pnpm install` exits 0 instead of ERR_PNPM_IGNORED_BUILDS.
# (The legacy `allowBuilds` spelling stays for older pnpm tooling.)
allowBuilds:
  esbuild: true
  core-js: true

onlyBuiltDependencies:
  - core-js
  - esbuild
