[project]
name = "club-mcp-server"
version = "0.1.0"
description = "MCP Server for Castillo Country Club — AI-powered private club management"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Castillo Country Club"}]
readme = "README.md"

dependencies = [
    # Core MCP + API
    "fastmcp>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & Settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Cache & Search
    "redis>=5.2.0",
    "pgvector>=0.3.0",
    # AI
    "ollama>=0.4.0",
    "httpx>=0.28.0",
    # ML & Data Science
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Observability
    "structlog>=24.4.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyjwt>=2.12.1",
    "bcrypt>=5.0.0",
    "anthropic>=0.102.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "chardet>=5.2.0",

]

[project.optional-dependencies]
ml = [
    "prophet>=1.1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]


[project.scripts]
club-mcp = "club_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/club_mcp"]

# ═══════════════════════════════════════════════════════════
# Ruff — linter + formatter
# ═══════════════════════════════════════════════════════════

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "TCH",    # flake8-type-checking (move imports to TYPE_CHECKING)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line length — handled by formatter
    "N805",   # first argument of method should be named 'self'
]

[tool.ruff.lint.isort]
known-first-party = ["club_mcp"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "SIM300",   # Yoda conditions in assertions are fine
    "B011",     # assert False in tests
    "ASYNC100", # async tests don't need timeouts
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ═══════════════════════════════════════════════════════════
# Mypy — static type checking
# ═══════════════════════════════════════════════════════════

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "fastmcp.*",
    "ollama.*",
    "pgvector.*",
]
ignore_missing_imports = true

# ═══════════════════════════════════════════════════════════
# Pytest — testing
# ═══════════════════════════════════════════════════════════

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
# pytest-asyncio>=0.25: sin esto, la DeprecationWarning de loop scope
# escala a error por filterwarnings=["error",...] y pytest muere con
# INTERNALERROR antes de colectar un solo test.
asyncio_default_fixture_loop_scope = "function"
timeout = 30
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "hitl: marks HITL workflow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:datetime.*",
    "error",
    "ignore::DeprecationWarning:pydantic.main.*",
    # Python 3.14: chromadb 1.5.9 usa asyncio.iscoroutinefunction en su import
    # (telemetry/opentelemetry/__init__.py:128), deprecado desde 3.14. En
    # filterwarnings las entradas POSTERIORES tienen mayor precedencia (pytest
    # aplica la lista en orden inverso), por lo que este ignore DEBE ir despues
    # de "error": si va antes, el warning escala a error y revientan los 48
    # tests de document_intelligence en el setup del fixture doc_repo.
    # Eliminar esta linea cuando chromadb > 1.5.9 arregle el import.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

# ═══════════════════════════════════════════════════════════
# Coverage
# ═══════════════════════════════════════════════════════════

[tool.coverage.run]
source = ["club_mcp"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/scaffold.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "@abstractmethod",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"
