# Alembic — Ola 2.1 (migración 0001_users).
# Config mínima y EXPLÍCITA: el script_location es el paquete alembic/
# junto a este ini (backend/alembic/). La URL NUNCA vive acá (llega por
# env.py desde settings DATABASE_URL o ALEMBIC_DATABASE_URL — Q-SEC-01:
# ni un secreto placeholder en un archivo de configuración versionado).
[alembic]
script_location = alembic
# sqlalchemy.url se resuelve en env.py — no acá (ver arriba).
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
timezone = UTC
truncate_slug_length = 40
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
