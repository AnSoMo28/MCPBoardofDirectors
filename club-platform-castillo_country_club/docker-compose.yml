services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: club_db
      POSTGRES_USER: club_user
      POSTGRES_PASSWORD: club_pass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
volumes:
  pgdata:
  ollama_data: